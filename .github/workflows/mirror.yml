name: mirror

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch official CSV
        run: |
          curl -fsSL --max-time 90 --retry 3 \
            "http://www.vpngate.net/api/iphone/" -o servers.csv

      - name: Loose sanity check (payload is CSV, not an error page)
        run: |
          # curl -f already guarantees HTTP 200. Reject anything that does
          # not even look CSV-ish; the strict format check happens on the
          # consumer side too.
          [ "$(wc -c < servers.csv)" -gt 1000 ]
          head -c 200 servers.csv | tr -d '\0' | grep -q ','

      - name: Commit if changed
        run: |
          git config user.name "mirror-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add servers.csv
          if git diff --cached --quiet; then
            echo "No changes since last run."
          else
            git commit -m "Refresh server list $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
